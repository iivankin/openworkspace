<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8f8f7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link id="app-favicon" rel="icon" href="/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png" />
    <title>OpenWorkspace</title>
    <script>
      (() => {
        const theme = localStorage.getItem("openworkspace-theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = theme === "dark" || (theme !== "light" && prefersDark);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="color-scheme"]')?.setAttribute("content", dark ? "dark" : "light");
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#181817" : "#f8f8f7");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
